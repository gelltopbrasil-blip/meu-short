name: Render Short
on:
  workflow_dispatch:
  push:
    paths:
      - roteiro.json
      - src/**

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: out/short.mp4
